version: '3.9'

services:
  db:
    image: postgres:latest
    container_name: postgres_container
    restart: always
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    networks:
      - label_loader
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
    container_name: backend_app
    env_file:
      - ./.env
    ports:
      - "8081:8081"
    networks:
      - label_loader
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80" # Map container port 80 (Nginx) to host port 3000
    depends_on:
      - backend
    networks:
      - label_loader

volumes:
  db_data:

networks:
  label_loader:
    driver: bridge
